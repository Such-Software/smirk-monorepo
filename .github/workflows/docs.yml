name: docs

# Keeps the public docs honest: the generated API client cannot drift from the
# committed OpenAPI contract, no secrets/infra identifiers reach the tree, and
# doc links resolve.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-client-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Regenerates src/api/schema.d.ts from openapi.json and fails if it differs
      # from what is committed (i.e. the spec changed but the client was not regenerated).
      - run: npm run check:api -w @smirk/core

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The project-specific known-bad literals (infra IPs, funded test-wallet
      # seed/address) are NOT in the repo — the scanner loads them from a
      # git-ignored file. CI reconstitutes that file from a repository secret so
      # the full scan runs here too. If the secret is unset (e.g. a fork), the
      # file is not written and the scanner runs generic-only and still passes.
      - name: Reconstitute project-literal patterns (if provided)
        env:
          SECRET_SCAN_PATTERNS: ${{ secrets.SECRET_SCAN_PATTERNS }}
        run: |
          if [ -n "$SECRET_SCAN_PATTERNS" ]; then
            printf '%s\n' "$SECRET_SCAN_PATTERNS" > scripts/secret-scan.local.txt
          fi
      - run: bash scripts/secret-scan.sh

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --no-color './**/*.md'
        # Existing docs may carry stale links; surface them without blocking
        # until the backlog is cleared, then drop continue-on-error.
        continue-on-error: true
