name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-features

      # Test only the Smirk crates. Vendored monero-oxide ships
      # daemon-RPC integration tests that require a live monerod at
      # 127.0.0.1:18081 and would always fail in CI.
      - name: cargo test
        run: cargo test -p smirk-wasm -p grin-ext -p btc-ext -p swap-core

      # Clippy only the Smirk crates. `--no-deps` is load-bearing — `-p`
      # filters which crate cargo focuses on but vendored transitive
      # deps still get linted without it. The secp256k1zkp + monero-oxide
      # subtrees ship code that pre-dates several modern clippy lints
      # (redundant_field_names, into_iter_on_ref, etc.); we don't restyle
      # vendored code. Add new Smirk crates to this list as they land.
      - name: cargo clippy
        run: cargo clippy -p smirk-wasm -p grin-ext -p btc-ext -p swap-core --all-targets --no-deps -- -D warnings

  wasm:
    name: WASM bundle
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (wasm C target)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: |
          # Match the wasm-bindgen lib version in Cargo.lock
          WB_VERSION=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          echo "Installing wasm-bindgen-cli ${WB_VERSION}"
          cargo install -f wasm-bindgen-cli --version "${WB_VERSION}"

      - name: Build WASM
        run: make wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: smirk-wasm-pkg
          path: crates/smirk-wasm/pkg/
          retention-days: 14

  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (wasm C target)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: |
          WB_VERSION=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          cargo install -f wasm-bindgen-cli --version "${WB_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build WASM (browser target)
        run: make wasm

      - name: Install TS deps
        run: npm install

      # Build in topological dependency order: leaves first, then
      # consumers. `tsc -p tsconfig.json` (the per-package `build`
      # script) IS a typecheck that emits — running it in order means
      # each consumer finds its deps' `dist/` already populated.
      #
      # `npm run typecheck --workspaces` doesn't emit dist/ files, so
      # running it before build leaves later workspaces unable to
      # resolve their @smirk/* imports.
      #
      # When adding a new TS package, append it here in dep order.
      - name: Build workspace (topological)
        run: |
          # Derived topological order (scripts/build-workspaces.mjs) so the build
          # list can't drift out of sync with the code; then the extension itself.
          make libs
          npm run build -w @smirk/extension

      - name: Typecheck workspace
        run: npm run typecheck --workspaces --if-present

      - name: Test workspace
        run: npm test --workspaces --if-present

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      # ENFORCED: the wallet's SHIPPED runtime dependencies (crypto, signing,
      # nostr) must carry no high/critical advisory. Dev-only tooling is excluded
      # here and covered by the informational pass below.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      # INFORMATIONAL: surfaces dev-tooling + moderate advisories without blocking.
      - name: npm audit (full, advisory)
        run: npm audit || true
      # INFORMATIONAL: RustSec advisories for the Smirk + vendored crates. Advisory
      # for now (the vendored monero-oxide/secp256k1zkp subtrees pin older deps).
      # TODO: promote to a tuned cargo-deny (root deny.toml with subtree exceptions).
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit (advisory)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true
