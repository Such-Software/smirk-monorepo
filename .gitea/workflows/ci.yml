name: CI (Gitea)

# The real CI gate for this repo.
#
# GitHub Actions is disabled at the org level, deliberately: code lives on
# GitHub but builds run here (see .gitea/workflows/desktop-build.yml). So this
# file, not `.github/workflows/ci.yml`, is where the correctness gates execute:
# rust check / test / clippy, the wasm build, the topological TS build,
# typecheck, unit tests, the API check, the secret scan, and the dependency
# audit.
#
# Keep this in sync with .github/workflows/ci.yml, or delete that one. Two
# copies of a gate, one of which cannot run, produces a green-looking release
# gated on nothing.
#
# `runs-on: ubuntu-latest` is the label this instance's Linux runner advertises
# (see the matrix in desktop-build.yml). A label no runner claims queues forever
# with no error, which is indistinguishable from a broken runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # @stable here installs a working rustup/cargo on the runner; it does NOT
        # decide which compiler builds our code. rust-toolchain.toml pins that, and
        # rustup honours it for every cargo call inside the checkout, installing the
        # pinned toolchain with its components and targets on first use. Do not pin a
        # version on this action: three jobs share one ~/.rustup on this runner, and
        # having them each install a specific toolchain concurrently raced badly
        # (clippy step hit "cargo: command not found" mid-job).
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      # `--lib` (unit tests) deliberately, not the full test set.
      #
      # The vendored monero-oxide subtrees carry upstream INTEGRATION tests that
      # dial a live monerod on 127.0.0.1:18081 (both
      # interface/daemon/simple-request/tests and wallet/tests). They fail with
      # ConnectionRefused on any machine without a node, and pass on a developer
      # workbench that runs one, which is exactly how a gate looks green locally
      # and red in CI. They exercise upstream's RPC client against a chain, not
      # our code, and this repo is not where they should gate a release.
      #
      # Excluding crates one at a time was whack-a-mole; the property that
      # actually distinguishes them is unit vs integration.
      - name: cargo test (unit)
        run: cargo test --workspace --lib

      # Lint OUR crates strictly; do not gate the release on vendored upstream
      # style. `--workspace -D warnings` failed on crates/secp256k1zkp
      # (`assert!(x == false)`, `.clone()` on a Copy type) and on monero-oxide.
      # Those are subtrees we track upstream, so "fixing" them means carrying a
      # diff we have to rebase forever, for lints that say nothing about whether
      # the wallet is correct.
      # ENFORCED on the crates that are clean today. `--no-deps` matters: without
      # it `-D warnings` propagates into the vendored subtrees and the gate fails
      # on upstream style we do not own.
      - name: cargo clippy (enforced)
        run: |
          cargo clippy --all-targets --no-deps \
            -p smirk-wasm -p btc-ext -p swap-core \
            -- -D warnings

      # ADVISORY: grin-ext carries 13 findings (doc formatting, two very-complex
      # types, a dead method, and three cast truncations that are worth a real
      # look on wasm32, where usize is 32-bit). Reported, not enforced, so the
      # backlog is visible instead of either silently ignored or holding CI red
      # forever. Promote to -D warnings once it is clean.
      # TODO(grin-ext): clear these and move this crate into the enforced step.
      # `continue-on-error`, not `| tail` or `|| true`: the runner shell uses
      # pipefail, so piping did NOT make this advisory and the job still failed
      # on grin-ext's backlog. `|| true` would hide the findings entirely. This
      # prints them, marks the step failed, and lets the job pass.
      - name: cargo clippy (grin-ext, advisory)
        continue-on-error: true
        run: cargo clippy --all-targets --no-deps -p grin-ext

  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (wasm C target)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust toolchain
        # @stable here installs a working rustup/cargo on the runner; it does NOT
        # decide which compiler builds our code. rust-toolchain.toml pins that, and
        # rustup honours it for every cargo call inside the checkout, installing the
        # pinned toolchain with its components and targets on first use. Do not pin a
        # version on this action: three jobs share one ~/.rustup on this runner, and
        # having them each install a specific toolchain concurrently raced badly
        # (clippy step hit "cargo: command not found" mid-job).
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Pin to the wasm-bindgen version the lockfile actually resolves. A
      # hardcoded version here silently mismatched the lockfile and the install
      # was swallowed with `|| true`, so the wasm build ran against whatever was
      # already on the runner.
      - name: Install wasm-bindgen-cli
        run: |
          WB_VERSION=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          cargo install -f wasm-bindgen-cli --version "${WB_VERSION}"

      # Node 22, not 20: @smirk/extension's test script is
      # `node --test 'src/**/*.test.ts'`, and glob expansion by node --test needs
      # 22. On 20 it reports "Could not find ..." and fails the job, which is also
      # what a contributor on node 20 would hit locally.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build WASM (browser target)
        run: make wasm

      - name: Install TS deps
        run: npm install

      # Topological order matters: `tsc -p` emits, so each consumer needs its
      # dependencies' dist/ already populated. `make libs` derives the order from
      # scripts/build-workspaces.mjs so the list cannot drift from the code.
      - name: Build workspace (topological)
        run: |
          make libs
          npm run build -w @smirk/extension

      - name: Typecheck workspace
        run: npm run typecheck --workspaces --if-present

      # Explicitly the UNIT suites. `--workspaces --if-present` also picks up
      # @smirk/e2e, whose `test` script is `playwright test`: it needs a browser,
      # a running backend, and an extension built against that backend, so it
      # aborted the whole job on its own preflight. E2E has its own workflow and
      # its own environment; this job is the unit gate.
      #
      # Listed rather than filtered because npm has no workspace exclusion, and a
      # silent skip is worse than a missing entry: add new packages here.
      - name: Test workspace (unit)
        run: |
          for pkg in @smirk/assets @smirk/core @such-software/smirk-dapp-api \
                     @smirk/dapp-browser @smirk/extension @smirk/keymap \
                     @smirk/swap @smirk/ui; do
            echo "── $pkg ──"
            npm test -w "$pkg"
          done

  openapi-drift:
    name: API client is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TS deps
        run: npm install
      # Fails when openapi.json changed but the generated client was not
      # regenerated, i.e. the wallet is compiled against a contract the backend
      # does not serve.
      - name: API client drift
        run: npm run check:api -w @smirk/core

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The project-specific known-bad literals (infra IPs, funded test-wallet
      # address) live in a git-ignored file; CI reconstitutes it from a secret so
      # the full scan runs. Without the secret the scanner runs generic-only.
      - name: Reconstitute project-literal patterns (if provided)
        env:
          SECRET_SCAN_PATTERNS: ${{ secrets.SECRET_SCAN_PATTERNS }}
        run: |
          if [ -n "$SECRET_SCAN_PATTERNS" ]; then
            printf '%s\n' "$SECRET_SCAN_PATTERNS" > scripts/secret-scan.local.txt
          fi
      - run: bash scripts/secret-scan.sh

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
      # ENFORCED: shipped runtime dependencies (crypto, signing, nostr) must carry
      # no high/critical advisory.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      # INFORMATIONAL: dev tooling + moderate advisories, non-blocking.
      - name: npm audit (full, advisory)
        run: npm audit || true
      # @stable here installs a working rustup/cargo on the runner; it does NOT
      # decide which compiler builds our code. rust-toolchain.toml pins that, and
      # rustup honours it for every cargo call inside the checkout, installing the
      # pinned toolchain with its components and targets on first use. Do not pin a
      # version on this action: three jobs share one ~/.rustup on this runner, and
      # having them each install a specific toolchain concurrently raced badly
      # (clippy step hit "cargo: command not found" mid-job).
      - uses: dtolnay/rust-toolchain@stable
      # INFORMATIONAL: the vendored monero-oxide / secp256k1zkp subtrees pin older
      # deps, so this is advisory until a tuned deny.toml lands.
      - name: cargo audit (advisory)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true
