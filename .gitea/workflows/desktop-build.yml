name: Desktop build (Gitea)

# Builds + signs the Tauri desktop app on the Builds Gitea runners and uploads
# the bundles as workflow artifacts. This is the Gitea counterpart to
# .github/workflows/desktop-release.yml: GitHub Actions is disabled on the
# primary repo, so the cross-platform build happens here and the signed
# artifacts are attached to the GitHub release by hand (or a later step).
#
# It deliberately does NOT create a release: tauri-action's release step targets
# the GitHub API, so here we just build, sign, and upload artifacts.
#
# ── SETUP (one-time) ──────────────────────────────────────────────────────────
# 1. Runner labels: `runs-on` below matches the Builds runners — linux-beast
#    (label `ubuntu-latest`) and mac-mini-m2 (label `macos-latest`).
#    (Windows is stubbed under `include:` for when hashbags-win-runner returns.)
# 2. Action fetching: the runner must resolve `uses:` actions from GitHub, i.e.
#    act_runner config `[default_actions_url] = https://github.com` (the default).
# 3. Secrets: set them with ~/keys/suchsoftware/set-gitea-desktop-secrets.sh
#    (prints lengths + HTTP statuses only). Without them the Linux job still
#    ships (no signing needed); the macOS job ships UNSIGNED/ad-hoc.
#    macOS codesign (Developer ID Application cert):
#      APPLE_CERTIFICATE            base64 of developer_id.p12
#      APPLE_CERTIFICATE_PASSWORD
#      APPLE_SIGNING_IDENTITY       "Developer ID Application: Such Software LLC (D8PL9F7X33)"
#      APPLE_TEAM_ID                D8PL9F7X33
#    macOS notarization (App Store Connect API key — notarytool):
#      APPLE_API_ISSUER             issuer UUID
#      APPLE_API_KEY                key id (e.g. CHK6B69G58)
#      APPLE_API_KEY_P8_BASE64      base64 of AuthKey_<id>.p8 (decoded to a file below)
# NOTE: the Tauri auto-UPDATER is intentionally OFF for v0.3.0 (tauri.conf.json
#   plugins.updater.active=false, no update server yet), so no TAURI_SIGNING_*
#   key is needed. Artifact authenticity is provided by a detached PGP signature
#   applied to the collected bundles out-of-band (jwinterm@wownero.org key).
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            args: '--target universal-apple-darwin'
            target: universal-apple-darwin
            os_label: macos
          - runner: ubuntu-latest
            # Explicit --target so the bundle lands in target/<target>/release,
            # matching the macOS path (an empty target builds to target/release).
            args: '--target x86_64-unknown-linux-gnu'
            target: x86_64-unknown-linux-gnu
            os_label: linux
          # Windows: uncomment when hashbags-win-runner is back (label: windows).
          # - runner: windows
          #   args: ''
          #   target: x86_64-pc-windows-msvc
          #   os_label: windows

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.os_label }} build
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os_label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Add macOS x86_64 target (universal binary)
        if: matrix.os_label == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packages/desktop/src-tauri

      - name: Install wasm-bindgen-cli (version-matched to Cargo.lock)
        shell: bash
        run: |
          WB_VERSION=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          cargo install -f wasm-bindgen-cli --version "${WB_VERSION}"

      - name: Build WASM
        shell: bash
        run: make wasm

      - name: Install workspace deps
        run: npm install

      - name: Build TypeScript workspace
        shell: bash
        run: |
          npm run build -w @smirk/wasm
          npm run build -w @smirk/assets
          npm run build -w @smirk/core
          npm run build -w @smirk/ui
          npm run build -w @smirk/dapp-api

      # notarytool authenticates with an App Store Connect API key (.p8). Secrets
      # can't be file paths, so decode the base64'd .p8 to a temp file and export
      # its path for tauri-action. macOS only; the Linux job skips this.
      - name: Prepare Apple notarization API key (macOS)
        if: matrix.os_label == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "APPLE_API_KEY_P8_BASE64 not set — macOS build will be signed but NOT notarized."
            exit 0
          fi
          key_path="$RUNNER_TEMP/apple_api_key_${APPLE_API_KEY:-key}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # tauri-action builds + (on macOS) imports the Developer ID cert into a temp
      # keychain, signs with hardened runtime, and notarizes via the API key when
      # the APPLE_* secrets are present. No tagName is set, so it does NOT create a
      # release: it just produces the signed + notarized bundles.
      - name: Build + sign Tauri bundles
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          # macOS code signing (Developer ID Application)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # macOS notarization (App Store Connect API key → notarytool)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}

      # Collect the installers + the updater signatures (.sig) + latest.json.
      - name: Upload bundles
        uses: actions/upload-artifact@v3
        with:
          name: smirk-desktop-${{ matrix.os_label }}-v0.3.0
          if-no-files-found: error
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz*
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage*
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi*
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis*
