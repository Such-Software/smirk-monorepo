name: Release build (Gitea)

# Builds + signs the Tauri desktop app on the Builds Gitea runners and uploads
# the bundles as workflow artifacts. This is the Gitea counterpart to
# .github/workflows/desktop-release.yml: GitHub Actions is disabled on the
# primary repo, so the cross-platform build happens here and the signed
# artifacts are attached to the GitHub release by hand (or a later step).
#
# It deliberately does NOT create a release: tauri-action's release step targets
# the GitHub API, so here we just build, sign, and upload artifacts.
#
# ── SETUP (one-time) ──────────────────────────────────────────────────────────
# 1. Runner labels: `runs-on` resolves from the matrix; `ubuntu-latest` and
#    `macos-latest` are the labels this instance's Linux and macOS runners
#    advertise. The Windows leg is stubbed under `include:` and only builds
#    when a runner claims the `windows` label.
# 2. Action fetching: the runner must resolve `uses:` actions from GitHub, i.e.
#    act_runner config `[default_actions_url] = https://github.com` (the default).
# 3. Secrets: set the APPLE_* repository secrets listed below. Without them the
#    Linux job still ships (no signing needed); the macOS job ships UNSIGNED/ad-hoc.
#    macOS codesign (Developer ID Application cert):
#      APPLE_CERTIFICATE            base64 of developer_id.p12
#      APPLE_CERTIFICATE_PASSWORD
#      APPLE_SIGNING_IDENTITY       "Developer ID Application: Such Software LLC (D8PL9F7X33)"
#      APPLE_TEAM_ID                D8PL9F7X33
#    macOS notarization (App Store Connect API key — notarytool):
#      APPLE_API_ISSUER             issuer UUID
#      APPLE_API_KEY                key id (e.g. CHK6B69G58)
#      APPLE_API_KEY_P8_BASE64      base64 of AuthKey_<id>.p8 (decoded to a file below)
# NOTE: the Tauri auto-updater is ON. tauri.conf.json holds the minisign PUBLIC
#   key and points at the `latest.json` published as a GitHub Release asset, so
#   there is no separate update host to run (releases.smirk.cash was never stood
#   up). The build needs TAURI_SIGNING_PRIVATE_KEY as a repository secret to
#   emit the .sig files that manifest refers to. The key is
#   PASSWORDLESS, so there is deliberately no _PASSWORD secret: a stale wrong
#   one is what broke the first build that actually exercised signing, and an
#   absent secret expands to empty, which is what the bundler wants. Artifact authenticity is provided by a detached PGP signature
#   applied to the collected bundles out-of-band, with the Smirk Releases key
#   <jw@such.software> (signing subkey 96F6836D5110C2CB). See KEYS.asc.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Isolated toolchain homes, one per job. These runners execute several jobs
    # concurrently as the same user, so a shared ~/.rustup and ~/.cargo means one
    # job's toolchain install rewrites binaries another job is mid-way through
    # using: cargo check and cargo test would pass, then the very next step died
    # with "cargo: command not found". rust-toolchain.toml made that window much
    # wider, because every cargo call in the checkout now consults rustup.
    env:
      RUSTUP_HOME: ${{ runner.temp }}/rustup
      CARGO_HOME: ${{ runner.temp }}/cargo
      # Swap is gated on this at BUILD time. Unset, the Swap tab renders a
      # "disabled in this build" notice, which is what every build shipped until
      # now, because nothing ever injected it.
      #
      # Vite substitutes VITE_* statically, so this value is readable in the
      # shipped bundle by anyone who unpacks it. It is a client-side identifier
      # for a service the wallet calls directly, not a bearer credential for our
      # backend. Consequence worth knowing: an outside party rebuilding from the
      # published source zip without this key gets different bytes.
      # pack-release.sh's reproducibility check still passes, because it builds
      # twice inside this same environment.
      VITE_TROCADOR_API_KEY: ${{ secrets.TROCADOR_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            args: '--target universal-apple-darwin'
            # `target` is only the Tauri bundle OUTPUT dir. `universal-apple-darwin`
            # is NOT a real rustup target (no rust-std for it) — a universal binary
            # is aarch64 + x86_64 lipo'd, so install BOTH real arches instead.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            os_label: macos
          - runner: ubuntu-latest
            # Explicit --target so the bundle lands in target/<target>/release,
            # matching the macOS path (an empty target builds to target/release).
            args: '--target x86_64-unknown-linux-gnu'
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            os_label: linux
          - runner: windows
            # Explicit --target so the output lands in target/<triple>/release
            # (matching the staging path); an empty target builds to target/release.
            args: '--target x86_64-pc-windows-msvc'
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            os_label: windows

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.os_label }} build
    # Default every run step to bash (git-bash on Windows). Otherwise Windows runs
    # steps in PowerShell, whose execution policy blocks the generated .ps1 (this
    # killed `npm install`), and our make/clang steps assume a POSIX shell anyway.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Version comes from the manifest, never a literal. Every path and artifact
      # name below used to hardcode 0.3.0, so the first build of 0.3.1 would have
      # staged its bundles into a v0.3.0 directory and uploaded them under a
      # v0.3.0 name: the same class of defect as a binary that cannot say which
      # build it is, and just as quiet.
      - name: Resolve version
        id: ver
        run: |
          V=$(node -p "require('./packages/extension/manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building desktop artifacts for v$V"

      # Cheap guard, and it belongs here rather than next to the signing step.
      # A dead signing token is invisible until the bundler calls the broker, which
      # on this runner is roughly 25 minutes of Rust and NSIS work later. That is
      # exactly what happened on 2026-09-07: a full compile spent to discover a
      # token that was present but not logged in.
      #
      # Two distinct faults, reported separately because they need different
      # people to fix them:
      #   - a tripped breaker needs an operator to clear a latch
      #   - a live breaker with a logged-out token needs someone at the console
      #
      # This never supplies a password, so it cannot consume one of the token's
      # three attempts. A logged-out token makes signtool sit on a prompt nobody
      # answers, so the timeout IS the signal.
      - name: Preflight the Windows signing token
        if: matrix.os_label == 'windows'
        shell: powershell
        run: |
          if (Test-Path 'C:\signing\SIGNING_LOCKED') {
              Write-Host '--- breaker contents ---'
              Get-Content 'C:\signing\SIGNING_LOCKED'
              throw 'preflight: the signing broker''s circuit breaker is tripped. An operator must clear it before this build is worth running.'
          }
          if (-not (Test-Path 'C:\signing\in')) {
              throw 'preflight: C:\signing\in is missing, so the broker is not serving this host.'
          }
          Write-Host 'preflight: breaker clear and broker queue present.'

          # A live-token probe was tried here and removed. It signed a throwaway
          # copy of where.exe, which Windows already ships signed by Microsoft, so
          # sign-windows.ps1's signer check correctly rejected it and the preflight
          # failed a build whose token was fine. A guard that reports a healthy
          # system as broken is worse than no guard: it costs a cycle AND sends the
          # operator to the wrong machine. Proving the token is live needs an
          # unsigned PE built on the spot, which is more machinery than this is
          # worth; the breaker check above already catches the case that actually
          # recurs, an operator who has not cleared the latch.

      - name: Install Linux dependencies
        if: matrix.os_label == 'linux'
        run: |
          # Two jobs from this workflow can land on the same runner at once and
          # both install packages; the loser dies with "Could not get lock" and
          # exit 100, which reads as a broken build rather than a shared host.
          #
          # DPkg::Lock::Timeout governs the dpkg frontend lock, NOT
          # /var/lib/apt/lists/lock which `apt-get update` contends on. The loser
          # of a two-job race died instantly even with the timeout set.
          apt_retry() {
            for attempt in $(seq 1 30); do
              if sudo apt-get -o DPkg::Lock::Timeout=60 "$@"; then return 0; fi
              echo "apt busy (attempt $attempt), another job holds the lock; retrying"
              sleep 10
            done
            echo 'apt still locked after 5 minutes'; return 1
          }
          apt_retry update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            clang
          # clang: the vendored secp256k1zkp build.rs compiles C to
          # wasm32-unknown-unknown via cc-rs, which needs a clang with the
          # WebAssembly LLVM target (Ubuntu's clang has it; gcc can't target wasm).

      # Apple's Xcode clang has the WebAssembly target stripped, so the same
      # secp256k1zkp wasm C build fails with "No available targets are compatible
      # with triple wasm32-unknown-unknown". Point cc-rs at Homebrew LLVM's clang
      # (+ llvm-ar) for the wasm target only; native macOS compilation is untouched.
      - name: Install wasm C toolchain (macOS LLVM)
        if: matrix.os_label == 'macos'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          # llvm carries a wasm-capable clang. brew's dependency-upgrade prompt
          # ignores NONINTERACTIVE here and aborts on stdin EOF, so pipe 'yes'. But
          # under `set -o pipefail` a plain `yes | brew` FAILS the step: brew exits
          # 0, then `yes` dies with SIGPIPE (141) and pipefail propagates it. Turn
          # pipefail off for that line so the step's status is brew's. Skipped
          # whenever llvm is already installed.
          if ! brew list llvm >/dev/null 2>&1; then
            set +o pipefail
            yes | brew install llvm
            set -o pipefail
          fi
          LLVM="$(brew --prefix llvm)"
          echo "CC_wasm32_unknown_unknown=$LLVM/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$LLVM/bin/llvm-ar" >> "$GITHUB_ENV"

      # Windows has no GNU make (our build goes through `make wasm`/`make libs`),
      # and MSVC's cl.exe can't target wasm32 (use LLVM clang for the wasm C).
      - name: Install Windows build tools (LLVM + make)
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          choco install llvm make -y || echo "choco install skipped (may already be present)"
          echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          CLANG="$(command -v clang || echo '/c/Program Files/LLVM/bin/clang.exe')"
          AR="$(command -v llvm-ar || echo '/c/Program Files/LLVM/bin/llvm-ar.exe')"
          echo "CC_wasm32_unknown_unknown=$CLANG" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$AR" >> "$GITHUB_ENV"

      # makensis fails 'Unable to start child process 0x2' (file not found) even
      # right after a fresh NSIS extract -> Defender is almost certainly
      # quarantining makensis.exe. Exclude the Tauri cache from Defender and wipe
      # any half-eaten NSIS cache so Tauri re-downloads it clean.
      # Best-effort Defender exclusion so makensis.exe isn't quarantined. Invoke
      # PowerShell INLINE (-Command, not a .ps1 file) from bash so the runner's
      # script-execution policy can't block it, and never fail the job (needs an
      # elevated runner for Add-MpPreference; if not elevated, do it on the box).
      - name: Defender exclusion for Tauri/NSIS cache (Windows)
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command 'try { Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\tauri" -ErrorAction Stop; Write-Host "Defender exclusion added" } catch { Write-Host "WARN: Defender exclusion failed (runner not elevated?): $($_.Exception.Message)" }' || echo "defender step non-fatal"
          rm -rf "$LOCALAPPDATA/tauri/NSIS" 2>/dev/null || true
          echo "cleared stale NSIS cache"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Windows runner ALREADY has a rustup home (C:\Users\ssh\.rustup) but
      # rustup is not on the PATH this job sees. dtolnay/rust-toolchain probes with
      # `command -v rustup`, decides it is absent, runs rustup-init, and that aborts:
      #   could not create home directory: 'C:\Users\ssh\.rustup':
      #   Cannot create a file when that file already exists. (os error 183)
      # macOS and Linux pass the identical step because rustup is on their PATH.
      # Putting the existing cargo bin on PATH makes the probe succeed, so the
      # action configures the toolchain instead of trying to reinstall it.
      - name: Point rustup somewhere usable (Windows)
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          # $USERPROFILE is a WINDOWS path (C:\Users\ssh) and bash cannot test it
          # directly, so translate it first. Without this the existing install is
          # invisible and the probe below reports "not found" while rustup-init
          # still trips over the very directory we failed to see.
          up="$(cygpath -u "$USERPROFILE" 2>/dev/null || printf '%s' "$USERPROFILE" | sed 's|\\|/|g; s|^\([A-Za-z]\):|/\L\1|')"
          echo "userprofile (unix form): $up"

          if [ -x "$up/.cargo/bin/rustup.exe" ]; then
            # Reuse the toolchain already on the box: the action's own
            # `command -v rustup` probe then succeeds and it skips installing.
            echo "$(cygpath -w "$up/.cargo/bin" 2>/dev/null || echo "$up/.cargo/bin")" >> "$GITHUB_PATH"
            echo "reusing existing rustup at $up/.cargo/bin"
          else
            # There is a rustup home but no usable binary. Rather than delete a
            # directory that other jobs on this shared runner may rely on, give
            # rustup a job-scoped home: rustup-init aborts only because its target
            # already exists, and a fresh path sidesteps that entirely.
            tmp="${RUNNER_TEMP:-$up/AppData/Local/Temp}"
            wtmp="$(cygpath -w "$tmp" 2>/dev/null || echo "$tmp")"
            printf 'RUSTUP_HOME=%s\\rustup\n' "$wtmp" >> "$GITHUB_ENV"
            printf 'CARGO_HOME=%s\\cargo\n'  "$wtmp" >> "$GITHUB_ENV"
            echo "no usable rustup; using a job-scoped RUSTUP_HOME/CARGO_HOME under $wtmp"
          fi

      - name: Install Rust toolchain
        # @stable here installs a working rustup/cargo on the runner; it does NOT
        # decide which compiler builds our code. rust-toolchain.toml pins that, and
        # rustup honours it for every cargo call inside the checkout, installing the
        # pinned toolchain with its components and targets on first use. Do not pin a
        # version on this action: three jobs share one ~/.rustup on this runner, and
        # having them each install a specific toolchain concurrently raced badly
        # (clippy step hit "cargo: command not found" mid-job).
        uses: dtolnay/rust-toolchain@stable
        with:
          # rust_targets holds REAL rustup targets (both mac arches for the
          # universal build); matrix.target is just the bundle output dir.
          #
          # These land on the toolchain THIS ACTION installs. rust-toolchain.toml
          # then makes cargo use the pinned toolchain instead, which does not
          # have them, so the next step adds them where the build will look.
          targets: wasm32-unknown-unknown,${{ matrix.rust_targets }}

      - name: Add the per-platform targets to the PINNED toolchain
        shell: bash
        run: |
          # Run inside the checkout on purpose: rustup resolves the toolchain
          # from rust-toolchain.toml here, so the targets are added to the one
          # cargo will actually build with.
          #
          # Without this the macOS universal build fails with "Target
          # x86_64-apple-darwin is not installed (installed targets:
          # aarch64-apple-darwin, wasm32-unknown-unknown)". Linux and Windows
          # hid it, because their target is their host and is present already.
          for t in $(printf '%s' "${{ matrix.rust_targets }}" | tr ',' ' '); do
            [ -n "$t" ] || continue
            echo "adding $t to $(rustc -vV | sed -n 's/^release: //p')"
            rustup target add "$t"
          done
          rustup target list --installed

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packages/desktop/src-tauri

      - name: Install wasm-bindgen-cli (version-matched to Cargo.lock)
        shell: bash
        run: |
          WB_VERSION=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          cargo install -f wasm-bindgen-cli --version "${WB_VERSION}"

      - name: Build WASM
        shell: bash
        run: make wasm

      - name: Install workspace deps
        run: npm install

      - name: Build TypeScript workspace
        shell: bash
        run: |
          # Derived topological order (scripts/build-workspaces.mjs) so the list
          # can't drift; builds wasm + every shared lib the desktop frontend needs.
          make libs

      # notarytool authenticates with an App Store Connect API key (.p8). Secrets
      # can't be file paths, so decode the base64'd .p8 to a temp file and export
      # its path for tauri-action. macOS only; the Linux job skips this.
      - name: Prepare Apple notarization API key (macOS)
        if: matrix.os_label == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "APPLE_API_KEY_P8_BASE64 not set — macOS build will be signed but NOT notarized."
            exit 0
          fi
          key_path="$RUNNER_TEMP/apple_api_key_${APPLE_API_KEY:-key}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # tauri-action builds + (on macOS) imports the Developer ID cert into a temp
      # keychain, signs with hardened runtime, and notarizes via the API key when
      # the APPLE_* secrets are present. No tagName is set, so it does NOT create a
      # release: it just produces the signed + notarized bundles.
      # Windows is built twice, on purpose.
      #
      # The signed installer is what users should run: an unknown-publisher
      # SmartScreen warning on a crypto wallet installer is the worst possible
      # place to spend a user's doubt. But a signed binary cannot be reproduced
      # by anyone outside this building, because the signature comes from a key
      # on a hardware token. Publishing the unsigned artifact alongside it is
      # what keeps the build independently verifiable.
      #
      # This pass runs first and with --no-sign, so it never touches the shared
      # signing queue. The signed pass follows and reuses the compiled objects,
      # so the second build is mostly re-bundling.
      - name: Build unsigned Windows artifacts
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # -w: the tauri script lives in the @smirk/desktop workspace, not the
          # root package. The signed pass goes through tauri-action, which resolves
          # that itself, which is why only this hand-written pass needed telling.
          npm run tauri -w @smirk/desktop -- build --target ${{ matrix.target }} --no-sign
          dest="$HOME/smirk-unsigned-v${{ steps.ver.outputs.version }}"
          rm -rf "$dest"; mkdir -p "$dest"
          base="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Renamed here rather than at publish time: two installers with the same
          # name in one directory is how the wrong one gets uploaded.
          for f in "$base"/nsis/*-setup.exe; do
            [ -e "$f" ] || continue
            cp -v "$f" "$dest/$(basename "${f%-setup.exe}")-setup-unsigned.exe"
          done
          ls -la "$dest"

      - name: Build + sign Tauri bundles
        uses: tauri-apps/tauri-action@v0
        id: tauri
        # Windows NSIS bundling is flaky on this runner (makensis "0x2"); the exe
        # itself always builds, so don't fail the Windows job on it — the staging
        # step below ships the portable exe. This MUST be a literal bool: Gitea's
        # act_runner parses YAML before evaluating ${{ }}, so a templated value
        # ("cannot unmarshal !!str into bool") breaks the whole workflow. We keep
        # it literally true and re-assert strictness for macOS/Linux below.
        continue-on-error: true
        env:
          # macOS code signing (Developer ID Application)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # macOS notarization (App Store Connect API key → notarytool)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          # Updater signing. tauri.conf.json carries the PUBLIC half and sets
          # updater.active = true, so every shipped build checks for updates.
          # Without these the bundler emits no .sig, and an update the app finds
          # can never be verified, stranding users on the version they installed.
          # minisign, from `tauri signer generate`. NOT the PGP release key: that
          # signs artifacts for humans, this signs update payloads for the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}

      # Re-assert strictness for macOS/Linux: since continue-on-error is a literal
      # `true` (Gitea can't template it), a genuine build failure on those two would
      # otherwise be swallowed. Fail the job here if the tauri step didn't succeed.
      # Windows is intentionally exempt (NSIS is allowed to fail; exe is staged).
      - name: Enforce build success (macOS/Linux)
        if: matrix.os_label != 'windows' && steps.tauri.outcome != 'success'
        shell: bash
        run: |
          echo "tauri build failed on ${{ matrix.os_label }} (outcome=${{ steps.tauri.outcome }})"
          exit 1

      # Collect the installers into a SINGLE space-free tar.gz, then upload that.
      # Why: the Tauri bundles are named "Smirk Wallet_0.3.0_amd64.AppImage" (with
      # a space). actions/upload-artifact@v3 aborts the chunk PUT on a filename
      # with a space (uploads 0 bytes), so Gitea's finalize 500s with
      # "Error merge chunks: lstat .../actions_artifacts/tmp<run>: no such file".
      # One archive with no space in ITS name sidesteps the whole problem (the
      # space-named files inside the tarball are fine). Also stage a copy to a
      # persistent runner dir as a belt-and-suspenders fallback.
      - name: Archive bundles (space-free) + stage to runner
        if: always()
        shell: bash
        run: |
          dest="$HOME/smirk-desktop-v${{ steps.ver.outputs.version }}/${{ matrix.os_label }}"
          rm -rf "$dest"; mkdir -p "$dest"
          base="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$base" -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz*' -o -name '*.AppImage*' \
            -o -name '*.deb*' -o -name '*.rpm*' -o -name '*.msi*' -o -name '*-setup.exe*' \
          \) -exec cp -v {} "$dest/" \; 2>/dev/null || true
          # The trailing wildcards are load-bearing: they pull each bundle's
          # `.sig` across. Windows was the one pattern without one, so the NSIS
          # updater signature was produced and then left behind, making Windows
          # the single platform missing from latest.json. A platform absent from
          # the manifest does not error, it just never updates.
          # macOS: the notarized + stapled .app is a DIRECTORY, not a file.
          find "$base" -maxdepth 3 -type d -name '*.app' -exec cp -R {} "$dest/" \; 2>/dev/null || true
          # macOS: build the .dmg from the notarized .app with hdiutil (pure CLI,
          # no AppleScript/WindowServer — that's why Tauri's bundle_dmg.sh fails on
          # the daemon runner). The .app is already signed+notarized+stapled, so it
          # passes Gatekeeper; the DMG is just a drag-to-Applications container.
          if [ "${{ matrix.os_label }}" = "macos" ]; then
            app="$(ls -d "$dest"/*.app 2>/dev/null | head -1)"
            if [ -n "$app" ]; then
              dmgsrc="$(mktemp -d)"
              cp -R "$app" "$dmgsrc/"
              ln -s /Applications "$dmgsrc/Applications"
              hdiutil create -volname "Smirk Wallet" -srcfolder "$dmgsrc" -ov -format UDZO \
                "$dest/Smirk-Wallet-${{ steps.ver.outputs.version }}.dmg" && rm -rf "$app" || echo "hdiutil dmg failed; keeping .app"
              rm -rf "$dmgsrc"
            fi
          fi
          # Windows: also stage the raw portable exe (target/<triple>/release) so a
          # shippable artifact exists even when NSIS bundling fails on this runner.
          if [ "${{ matrix.os_label }}" = "windows" ]; then
            exe="packages/desktop/src-tauri/target/${{ matrix.target }}/release/smirk-desktop.exe"
            if [ -f "$exe" ]; then
              # Two portables, matching the installer pair. Tauri signs a copy it
              # bundles and leaves target/release untouched, so the raw exe here is
              # unsigned even though the bundler reported signing smirk-desktop.exe.
              # Verified by size: the staged file was byte-for-byte the length of the
              # unsigned build, and a signed PE is larger.
              cp -v "$exe" "$dest/SmirkWallet-${{ steps.ver.outputs.version }}-portable-unsigned.exe"
              cp -v "$exe" "$dest/SmirkWallet-${{ steps.ver.outputs.version }}-portable.exe"
              # Sign the shipping one through the same broker the bundler uses. A user
              # who runs the portable build gets the same publisher as one who runs the
              # installer; without this they get an unknown-publisher warning instead.
              powershell.exe -NoProfile -ExecutionPolicy Bypass \
                -File packages/desktop/src-tauri/scripts/sign-windows.ps1 \
                -Path "$dest/SmirkWallet-${{ steps.ver.outputs.version }}-portable.exe"
            else
              echo "no portable exe at $exe"
            fi
          fi
          echo "staged installers to: $dest"; ls -la "$dest" || true
          # Carry the unsigned installer across too. It is published beside the signed
          # one so the build stays independently reproducible; the signature comes
          # from a hardware token, so nobody outside can reproduce the signed bytes.
          #
          # It deliberately gets NO updater signature. latest.json must point at the
          # signed installer, or the updater would hand every existing user an
          # unsigned binary and re-raise the SmartScreen warning on each update.
          if [ -d "$HOME/smirk-unsigned-v${{ steps.ver.outputs.version }}" ]; then
            cp -v "$HOME/smirk-unsigned-v${{ steps.ver.outputs.version }}"/*.exe "$dest/" 2>/dev/null || true
          fi
          mkdir -p artifacts-out
          tar -czf "artifacts-out/smirk-desktop-${{ matrix.os_label }}-v${{ steps.ver.outputs.version }}.tar.gz" -C "$dest" . \
            && echo "archived $(ls -la artifacts-out/*.tar.gz)" || echo "nothing to archive"

      # A green Windows job must not be able to ship an unsigned installer.
      #
      # The bundling step carries continue-on-error because NSIS is flaky on this
      # runner, and that flag once turned a failed signing pass into a passing job:
      # the build errored with "failed to run powershell", the staging step copied
      # the unsigned installer left by the --no-sign pass, and the artifact shipped
      # labelled as signed. Nothing reported it. Only opening the file did.
      #
      # So assert the property directly on the artifact that ships, rather than
      # trusting the exit status of the step that was meant to produce it.
      - name: Verify the Windows installer is actually signed
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # bash + powershell.exe rather than `shell: pwsh`: bash is the shell every
          # other step on this runner already uses, and pwsh is not known to be
          # installed. The .exe suffix matters too, since that spawn is exactly
          # what failed for the bundler.
          powershell.exe -NoProfile -ExecutionPolicy Bypass \
            -File packages/desktop/src-tauri/scripts/verify-windows-signature.ps1 \
            -Dest "$HOME/smirk-desktop-v${{ steps.ver.outputs.version }}/windows"

      - name: Upload bundle archive
        # NOT continue-on-error: this is the release path, and a swallowed upload
        # failure leaves a green job with no artifact to sign, which is
        # indistinguishable from success until someone goes looking for the
        # bundle. Fail loudly instead.
        uses: actions/upload-artifact@v3
        env:
          # The runner uploads artifacts to https://git.such.software, which serves
          # a self-signed cert, and upload-artifact's Node rejects it
          # (DEPTH_ZERO_SELF_SIGNED_CERT). Trust it for this internal-only upload.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        with:
          name: smirk-desktop-${{ matrix.os_label }}-v${{ steps.ver.outputs.version }}
          if-no-files-found: warn
          path: artifacts-out/smirk-desktop-${{ matrix.os_label }}-v${{ steps.ver.outputs.version }}.tar.gz

      # Attach the archive to a Gitea release, so collection never depends on the
      # artifacts API.
      #
      # That API reports total_count 0 on this instance even for runs that plainly
      # uploaded (confirmed on completed runs 6394 and 6086). The only routes left
      # were a browser download or a shell on the Gitea box, and the second means
      # handing out an interactive account to work around a bug. The releases API
      # on the same host, with the same token, works, so every leg publishes to
      # one place a script can fetch.
      #
      # Tag builds only: a release keyed on a branch is meaningless, and this must
      # never invent one for an ordinary push.
      # Also push straight to the GitHub release, which is where these artifacts
      # are actually consumed.
      #
      # The Gitea hop has failed twice: its Actions artifacts API reports
      # total_count 0 for runs that plainly uploaded, and release attachments 404
      # through every API auth form even though the metadata reports a correct
      # size. Only a browser session can retrieve them, so every release needed a
      # human with a browser in the middle of an otherwise automated pipeline.
      #
      # Uploading here removes that middleman rather than working around it. The
      # Gitea release upload above stays as the local copy.
      #
      # Skipped quietly when the token is absent, so a fork or a local runner does
      # not fail a build over a credential it was never given.
      - name: Publish archive to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GITHUB_RELEASE_TOKEN not set; skipping the GitHub upload"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="Such-Software/smirk-monorepo"
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          shopt -s nullglob
          FILES=(artifacts-out/smirk-desktop-${{ matrix.os_label }}-v${{ steps.ver.outputs.version }}.tar.gz)
          [ ${#FILES[@]} -gt 0 ] || { echo "nothing to upload"; exit 1; }
          # Resolve the release id. The release must already exist: creating one
          # here could publish a half-populated release while other legs build.
          code=$(curl -sS -o rel-gh.json -w '%{http_code}' -H "$AUTH" "$API/releases/tags/$TAG" || true)
          if [ "$code" != "200" ]; then
            echo "no GitHub release for $TAG (HTTP $code); skipping"
            exit 0
          fi
          ID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("rel-gh.json","utf8")).id)')
          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            # Replace a same-named asset from an earlier attempt, so a re-run does
            # not leave two that differ only by which build produced them.
            OLD=$(node -e 'const d=JSON.parse(require("fs").readFileSync("rel-gh.json","utf8"));console.log((d.assets||[]).filter(a=>a.name===process.argv[1]).map(a=>a.id).join(" "))' "$NAME")
            for oid in $OLD; do
              curl -sS -o /dev/null -X DELETE -H "$AUTH" "$API/releases/assets/$oid" || true
            done
            curl -sS --fail-with-body -o /dev/null -X POST -H "$AUTH" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$NAME"
            echo "uploaded $NAME to the GitHub release $TAG"
          done

      - name: Publish archive to the Builds release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # rel.json is workspace-relative on purpose. git-bash translates an
          # absolute /tmp path to its own root, while node is a native Windows
          # binary and reads the same string as C:\tmp, so the two disagree about
          # which file they are using and the Windows leg died on ENOENT after a
          # fully signed build. A relative path resolves identically for both.
          TAG="${GITHUB_REF#refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token $GITEA_TOKEN"
          shopt -s nullglob
          FILES=(artifacts-out/smirk-desktop-${{ matrix.os_label }}-v${{ steps.ver.outputs.version }}.tar.gz)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no archives to publish; the upload step above should have caught this"
            exit 1
          fi
          # Reuse a release a sibling leg already created: four legs share one tag,
          # so each creating its own would race.
          code=$(curl -sk -o rel.json -w '%{http_code}' -H "$AUTH" "$API/releases/tags/$TAG" || true)
          if [ "$code" != "200" ]; then
            # Draft, so a half-populated release is never mistaken for a shipped one
            # while other legs are still building.
            # Not a draft: Gitea does not associate a draft with its tag, so
            # `releases/tags/$TAG` 404s and the assets are unreachable, which is the
            # whole point of publishing here. prerelease marks it as CI output on an
            # internal ingress repo, not something shipped to users.
            BODY="{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":true}"
            curl -sk -o /dev/null -X POST -H "$AUTH" -H 'Content-Type: application/json' -d "$BODY" "$API/releases" || true
            # A concurrent leg may have won the create, so re-read rather than fail.
            curl -sk -o rel.json -H "$AUTH" "$API/releases/tags/$TAG"
          fi
          # node, not python3: the Windows runner's git-bash has no python3, and
          # this step died with exit 127 after a full signed build had succeeded.
          # node is guaranteed here because the build just used it.
          ID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("rel.json","utf8")).id)')
          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            # Drop a same-named asset from an earlier attempt, so a re-run does not
            # leave two assets differing only by which build produced them.
            OLD=$(node -e 'const d=JSON.parse(require("fs").readFileSync("rel.json","utf8"));console.log((d.assets||[]).filter(a=>a.name===process.argv[1]).map(a=>a.id).join(" "))' "$NAME")
            for oid in $OLD; do
              curl -sk -o /dev/null -X DELETE -H "$AUTH" "$API/releases/$ID/assets/$oid" || true
            done
            curl -sk --fail-with-body -o /dev/null -X POST -H "$AUTH" -F "attachment=@$FILE" "$API/releases/$ID/assets?name=$NAME"
            echo "published $NAME to release $TAG"
          done

  # ── Extension artifacts ──────────────────────────────────────────────────────
  # Added 2026-08-18. Before this, the three extension zips were built by hand on
  # a workstation into a gitignored directory while the desktop bundles came from
  # CI, so the ten release artifacts shipped with two different provenance
  # stories. The weaker half is the one that goes to the Chrome Web Store and
  # AMO. Worse, it had already bitten us: when the working checkout disappeared
  # from jw-laptop the zips existed nowhere and the checksums recorded at the tag
  # described files that could not be regenerated.
  #
  # Runs in this workflow rather than ci.yml on purpose: artifacts must descend
  # from the tagged commit, and ci.yml runs on every push.
  extension:
    # Isolated toolchain homes, one per job. These runners execute several jobs
    # concurrently as the same user, so a shared ~/.rustup and ~/.cargo means one
    # job's toolchain install rewrites binaries another job is mid-way through
    # using: cargo check and cargo test would pass, then the very next step died
    # with "cargo: command not found". rust-toolchain.toml made that window much
    # wider, because every cargo call in the checkout now consults rustup.
    env:
      RUSTUP_HOME: ${{ runner.temp }}/rustup
      CARGO_HOME: ${{ runner.temp }}/cargo
      # Swap is gated on this at BUILD time. Unset, the Swap tab renders a
      # "disabled in this build" notice, which is what every build shipped until
      # now, because nothing ever injected it.
      #
      # Vite substitutes VITE_* statically, so this value is readable in the
      # shipped bundle by anyone who unpacks it. It is a client-side identifier
      # for a service the wallet calls directly, not a bearer credential for our
      # backend. Consequence worth knowing: an outside party rebuilding from the
      # published source zip without this key gets different bytes.
      # pack-release.sh's reproducibility check still passes, because it builds
      # twice inside this same environment.
      VITE_TROCADOR_API_KEY: ${{ secrets.TROCADOR_API_KEY }}
    name: extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (wasm C target)
        run: |
          # DPkg::Lock::Timeout governs the dpkg frontend lock, NOT
          # /var/lib/apt/lists/lock which `apt-get update` contends on. Two jobs
          # from this workflow can share a runner, and the loser died instantly
          # with "Could not get lock" even with the timeout set. Retry instead.
          apt_retry() {
            for attempt in $(seq 1 30); do
              if sudo apt-get -o DPkg::Lock::Timeout=60 "$@"; then return 0; fi
              echo "apt busy (attempt $attempt), another job holds the lock; retrying"
              sleep 10
            done
            echo 'apt still locked after 5 minutes'; return 1
          }
          apt_retry update
          apt_retry install -y clang

      - name: Install Rust toolchain
        # @stable here installs a working rustup/cargo on the runner; it does NOT
        # decide which compiler builds our code. rust-toolchain.toml pins that, and
        # rustup honours it for every cargo call inside the checkout, installing the
        # pinned toolchain with its components and targets on first use. Do not pin a
        # version on this action: three jobs share one ~/.rustup on this runner, and
        # having them each install a specific toolchain concurrently raced badly
        # (clippy step hit "cargo: command not found" mid-job).
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Pinned to whatever the lockfile resolves, matching ci.yml. A hardcoded
      # version silently mismatches and the wasm gets built by whichever
      # wasm-bindgen already sits on the runner.
      - name: Install wasm-bindgen-cli
        run: |
          WB_VERSION=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          cargo install -f wasm-bindgen-cli --version "${WB_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TS deps
        run: npm install

      # Version comes from the manifest, which is the source of truth. The desktop
      # legs above now resolve it the same way, so every leg of a release names
      # itself from one place.
      - name: Resolve version
        id: ver
        run: |
          V=$(node -p "require('./packages/extension/manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building extension artifacts for v$V"

      # pack-release.sh drives `make ext-chrome` / `make ext-firefox`, which
      # depend on the wasm target, so no separate wasm step is needed here.
      - name: Pack extension archives
        run: scripts/pack-release.sh "${{ steps.ver.outputs.version }}"

      # The whole point of pack-release.sh is that the archives are a function of
      # the commit rather than of the clock. Prove it on every release build
      # instead of trusting it: --verify rebuilds and checks against the sums
      # just recorded. Cheap here, since the macOS leg is the wall-clock pole.
      - name: Verify archives are reproducible
        run: scripts/pack-release.sh "${{ steps.ver.outputs.version }}" --verify

      - name: Stage artifacts
        run: |
          mkdir -p artifacts-out
          cp -v packages/extension/releases/* artifacts-out/
          ls -la artifacts-out

      - name: Upload extension archives
        # See the note on the desktop upload: a release upload must not fail
        # quietly.
        uses: actions/upload-artifact@v3
        env:
          # Same self-signed cert as the desktop upload above.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        with:
          name: smirk-extension-v${{ steps.ver.outputs.version }}
          if-no-files-found: error
          path: artifacts-out/

      # Attach the archive to a Gitea release, so collection never depends on the
      # artifacts API.
      #
      # That API reports total_count 0 on this instance even for runs that plainly
      # uploaded (confirmed on completed runs 6394 and 6086). The only routes left
      # were a browser download or a shell on the Gitea box, and the second means
      # handing out an interactive account to work around a bug. The releases API
      # on the same host, with the same token, works, so every leg publishes to
      # one place a script can fetch.
      #
      # Tag builds only: a release keyed on a branch is meaningless, and this must
      # never invent one for an ordinary push.
      # Also push straight to the GitHub release, which is where these artifacts
      # are actually consumed.
      #
      # The Gitea hop has failed twice: its Actions artifacts API reports
      # total_count 0 for runs that plainly uploaded, and release attachments 404
      # through every API auth form even though the metadata reports a correct
      # size. Only a browser session can retrieve them, so every release needed a
      # human with a browser in the middle of an otherwise automated pipeline.
      #
      # Uploading here removes that middleman rather than working around it. The
      # Gitea release upload above stays as the local copy.
      #
      # Skipped quietly when the token is absent, so a fork or a local runner does
      # not fail a build over a credential it was never given.
      - name: Publish archive to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
        run: |
