[package]
name = "smirk-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

# Use local monero-oxide for transaction construction
monero-oxide = { path = "../monero-oxide/monero-oxide", default-features = false }
monero-wallet = { path = "../monero-oxide/monero-oxide/wallet", default-features = false }
monero-base58 = { path = "../monero-oxide/monero-oxide/wallet/base58", default-features = false }
monero-ed25519 = { path = "../monero-oxide/monero-oxide/ed25519", default-features = false }
monero-io = { path = "../monero-oxide/monero-oxide/io", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
# Use same rand_core version as monero-oxide
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# Enable js feature for getrandom on wasm targets
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
