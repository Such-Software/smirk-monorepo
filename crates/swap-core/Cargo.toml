[package]
name = "swap-core"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Experimental peer-to-peer swap protocols for Smirk wallet"
repository = "https://github.com/Such-Software/smirk-monorepo"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
basicswap-interop = [
  "dep:aes", "dep:base64", "dep:bs58", "dep:cbc", "dep:hex", "dep:hmac",
  "dep:k256", "dep:ripemd", "dep:serde", "dep:serde_json", "dep:sha2", "dep:zeroize",
]

[dependencies]
aes = { version = "0.8", optional = true, features = ["zeroize"] }
base64 = { version = "0.22", optional = true }
bs58 = { version = "0.5", optional = true, features = ["check"] }
cbc = { version = "0.1", optional = true, features = ["alloc", "zeroize"] }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
k256 = { version = "0.13", optional = true, default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "schnorr", "alloc"] }
ripemd = { version = "0.1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1.8", optional = true, features = ["alloc"] }

[[example]]
name = "basicswap_fixture"
required-features = ["basicswap-interop"]

[lints]
workspace = true
