[package]
name = "grin-ext"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Smirk's Grin / Mimblewimble protocol implementation — slate construction, slatepack codec, NRD kernels, atomic-swap adaptor sigs."
repository = "https://github.com/Such-Software/smirk-monorepo"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# BIP39 mnemonic ↔ raw entropy (no network, no I/O)
bip39 = { version = "2.1", default-features = false, features = ["zeroize"] }

# HMAC-SHA512 for the "IamVoldemort" key derivation (matches grin-wallet/Grim)
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

# secp256k1 — pure-Rust implementation. Used for Schnorr signing on inputs/
# outputs/kernels and for deriving public keys from secret keys.
# Pure Rust (no FFI) so it compiles cleanly to wasm32 with no extra setup.
k256 = { version = "0.13", default-features = false, features = ["alloc", "arithmetic", "ecdsa"] }

# BLAKE2b — used in slatepack address derivation (hashes the secp256k1
# child key bytes before they become an ed25519 secret key) and in
# Grin's Schnorr-signature message hashing.
blake2 = { version = "0.10", default-features = false }

# ed25519 via curve25519-dalek — same library monero-oxide pulls in.
# Slatepack addresses are bech32-encoded ed25519 public keys.
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

# Bech32 encoding for human-readable slatepack addresses (grin1...).
bech32 = { version = "0.9", default-features = false }

# Hex encoding for ergonomic test fixtures
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# JSON for slate v4 wire format
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Zeroize secrets
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

# RNG for Schnorr nonce sampling.
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

# Enable getrandom's `js` feature on WASM targets so OsRng works in browsers.
# (Same workaround smirk-wasm uses.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
