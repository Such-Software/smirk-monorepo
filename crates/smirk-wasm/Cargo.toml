[package]
name = "smirk-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

# Vendored monero-oxide fork (Monero + Wownero transaction library).
# Package names on crates.io are wownero-*, library names stay monero_*.
# Rust code below uses `use monero_oxide::...` because [lib] name is preserved.
wownero-oxide = { path = "../monero-oxide/monero-oxide", default-features = false }
wownero-wallet = { path = "../monero-oxide/monero-oxide/wallet", default-features = false }
wownero-base58 = { path = "../monero-oxide/monero-oxide/wallet/base58", default-features = false }
wownero-ed25519 = { path = "../monero-oxide/monero-oxide/ed25519", default-features = false }
wownero-io = { path = "../monero-oxide/monero-oxide/io", default-features = false }

# Smirk's Grin / Mimblewimble crate — slate construction, slatepack codec,
# NRD kernels, atomic-swap adaptor sigs (built up across v0.3 → v0.4)
grin-ext = { path = "../grin-ext" }

# Smirk's BTC/LTC crate — BIP32 derivation, P2WPKH + P2TR address encoding,
# PSBT signing. Built on rust-bitcoin; parameterized for both chains.
btc-ext = { path = "../btc-ext" }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
# Use same rand_core version as monero-oxide
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# Enable js feature for getrandom on wasm targets
getrandom = { version = "0.2", features = ["js"] }

# Profile config moved to workspace root (Cargo warns about non-root profiles).
# WASM-specific opt settings inherited via [profile.release] in root Cargo.toml.
