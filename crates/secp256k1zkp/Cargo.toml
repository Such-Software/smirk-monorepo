[package]

name = "grin_secp256k1zkp"
version = "0.7.15"
authors = [ "Grin Developers <mimblewimble@lists.launchpad.net>",
            "Dawid Ciężarkiewicz <dpc@ucore.info>",
            "Andrew Poelstra <apoelstra@wpsoftware.net>" ]
license = "CC0-1.0"
homepage = "https://grin.mw"
repository = "https://github.com/mimblewimble/rust-secp256k1-zkp/"
description = "Grin's fork with Zero-Knowledge extensions of Rust bindings for Pieter Wuille's `libsecp256k1` library. Implements ECDSA for the SECG elliptic curve group secp256k1 and related utilities."
keywords = [ "crypto", "secp256k1", "grin", "bitcoin", "zero-knowledge" ]
readme = "README.md"
edition = "2018"

build = "build.rs"
[build-dependencies]
cc = "1.0"

[lib]
name = "secp256k1zkp"
path = "src/lib.rs"

# Smirk patch: removed obsolete `dev` feature and its `clippy` optional
# dep. They wired clippy-as-rustc-plugin (pre-2018 pattern); the `plugin`
# unstable feature was removed from rustc in 1.75.0 so any build with
# `--all-features` fails. Modern clippy is `cargo clippy` — no opt-in
# needed. See `crates/secp256k1zkp/src/lib.rs` for the matching change.
[features]
unstable = []
default = []
bullet-proof-sizing = []

[dependencies]
arrayvec = "0.7"
rand = "0.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.1", features = ["zeroize_derive"] }

[dev-dependencies]
chrono = "0.4.5"
rand_core = "0.2"
